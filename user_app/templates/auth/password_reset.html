{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% load widget_tweaks %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-900 pt-20">
    <div class="max-w-md w-full bg-gray-800 shadow-md rounded-lg overflow-hidden">
        <div class="p-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gradient mb-2">Reset Password</h2>
                <p class="text-gray-300">Enter your email to reset your password</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label for="id_email" class="block text-sm font-medium text-gray-300 mb-2">
                        Email:
                    </label>
                    <input type="email" name="email" id="id_email"
                        class="w-full px-4 py-3 rounded-lg border border-gray-700 bg-gray-700 text-white focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none"
                        placeholder="Enter your email address" required>
                    {% if form.email.errors %}
                    <div class="text-red-500 mt-2">
                        {{ form.email.errors }}
                    </div>
                    {% endif %}
                </div>

                <button type="submit"
                    class="w-full px-6 py-3 rounded-lg bg-green-400 text-white hover:opacity-90 transition-all duration-300 transform hover:scale-105">
                    Send Reset Link
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
