{% extends 'base.html' %}
{% block title %}Forget Password{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 pt-20">
    <div class="max-w-md w-full bg-white shadow-md rounded-lg overflow-hidden">
        <div class="p-8">
            <div class="text-center mb-8">
                <h2 class="text-3xl font-bold text-gradient mb-2">Reset Password</h2>
                <p class="text-gray-600">Enter your email to reset your password</p>
            </div>

            <form class="space-y-6" method="post">
                {% csrf_token %}
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email Address
                    </label>
                    <input type="email" name="email" id="email"
                        class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none"
                        placeholder="you@example.com" />
                </div>

                <button type="submit"
                    class="w-full px-6 py-3 rounded-lg bg-gradient text-white hover:opacity-90 transition-all duration-300 transform hover:scale-105">
                    Send Reset Link
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-600">
                    Remember your password?
                    <a href="/login" class="text-pink-500 hover:text-pink-400">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
