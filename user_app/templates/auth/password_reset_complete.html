{% extends 'base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-gray-100 pt-20">
    <div class="max-w-md w-full bg-white shadow-md rounded-lg p-8">
        <h2 class="text-3xl font-bold text-gradient text-center">
            Password Successfully Reset!
        </h2>
        <p class="text-gray-600 text-center mt-4">
            Your password has been updated. You can now log in with your new password.
        </p>
        <div class="mt-6 text-center">
            <a href="/login"
                class="inline-block px-4 py-2 bg-gradient text-white rounded transition duration-300 hover:opacity-90">
                Go to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
