{% extends "base.html" %}
<div>{% block title %}Login{% endblock %}</div>

{% block extra_head %}
<!-- Poppins Font -->
<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
  rel="stylesheet"
/>
<style>
  * {
    font-family: "Poppins", sans-serif;
  }
</style>
{% endblock %}

<div>
  {% block content %}
  <div
    class="min-h-screen flex items-center justify-center bg-gray-900 py-12 px-4"
  >
    <div
      class="max-w-md w-full bg-gray-800 border border-gray-700 shadow-2xl rounded-xl overflow-hidden"
    >
      <div class="p-8">
        <div class="text-center mb-8">
          <div
            class="w-16 h-16 rounded-full bg-primary/20 flex items-center justify-center mx-auto mb-4 border border-primary/30"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-8 w-8 text-primary"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              />
            </svg>
          </div>
          <h2 class="text-3xl font-bold text-white mb-2">Welcome Back</h2>
          <p class="text-gray-400">Sign in to your account</p>
        </div>

        <form class="space-y-6" method="post">
          {% csrf_token %}
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2"
              >Email Address</label
            >
            <input
              type="email"
              name="email"
              class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 text-white focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-colors"
              placeholder="you@example.com"
              required
            />
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2"
              >Password</label
            >
            <input
              type="password"
              name="password"
              class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 text-white focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-colors"
              placeholder="••••••••"
              required
            />
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input
                type="checkbox"
                name="remember"
                class="h-4 w-4 text-primary focus:ring-primary border-gray-600 rounded bg-gray-700"
              />
              <label class="ml-2 block text-sm text-gray-300">
                Remember me
              </label>
            </div>
            <a
              href="/password-reset"
              class="text-sm text-primary hover:text-primary/80 transition-colors"
            >
              Forgot password?
            </a>
          </div>

          <button
            type="submit"
            class="w-full btn-primary py-3 rounded-lg font-semibold hover:bg-primary/90 transition-all duration-300 transform hover:scale-105"
          >
            Sign In
          </button>
        </form>

        <div class="mt-6 text-center">
          <p class="text-gray-400">
            Don't have an account?
            <a
              href="{% url 'register' %}"
              class="text-primary hover:text-primary/80 font-semibold ml-1 transition-colors"
              >Sign up</a
            >
          </p>
        </div>
      </div>
    </div>
  </div>
  {% endblock %}
</div>
